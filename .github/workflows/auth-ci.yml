name: Auth Test CI with AWS Secrets

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  test-auth:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::<<ACCOUNT_ID>>:role/GitHubActionsRole
        aws-region: eu-west-2

    - name: Retrieve secrets from AWS Secrets Manager
      run: |
        SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id my-app-secrets --query SecretString --output text)
        echo "AUTH_USER=$(echo $SECRET_JSON | jq -r .AUTH_USER)" >> $GITHUB_ENV
        echo "AUTH_PASS=$(echo $SECRET_JSON | jq -r .AUTH_PASS)" >> $GITHUB_ENV

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Run auth test
      run: python auth_test.py
